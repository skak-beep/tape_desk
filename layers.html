<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#0c0c0d"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>重ね LAYERS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Dark looper. Stack of recorded layers on top; a sound set as 8 rows × 16 steps (each row its own speed); pads to play live; hold-FX; knobs; transport. */
:root{--bg:#0a0a0b;--bg-2:#141415;--fg:#dcd7cb;--dim:#6c685f;--line:#262523;--acc:#ff7a1a;--acc-2:#a64f17;--rec:#ff3b3b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
html,body{height:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#app{min-height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;box-sizing:border-box;gap:10px}
.top{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:6px}
.top .t{color:var(--acc);font-weight:600;font-size:14px;letter-spacing:.16em;white-space:nowrap}
.tabs{display:flex;gap:14px;color:var(--dim)} .tabs span{cursor:pointer;padding:4px 0} .tabs span.on{color:var(--fg);border-bottom:1px solid var(--acc)}
.top .r{margin-left:auto;color:var(--dim);font-size:11px;white-space:nowrap} .top .r b{color:var(--fg);font-weight:500} .top .r b.rec{color:var(--rec)}
#stack{width:100%;height:70px;display:block;border:1px solid var(--line)}
.pane{display:none;flex-direction:column;gap:10px}.pane.on{display:flex}
.sets{display:flex;gap:5px} .sets button{flex:1;padding:10px 2px;min-height:40px;font-size:12px}
/* grid: 8 rows, each = name | rate | 16 steps */
.grid{display:flex;flex-direction:column;gap:3px}
.rw{display:grid;grid-template-columns:72px 30px 1fr;gap:4px;align-items:stretch;height:30px}
.rw .nm{border:1px solid var(--line);border-radius:3px;background:var(--bg-2);display:flex;align-items:center;padding:0 7px;font-size:11px;cursor:pointer;touch-action:none;white-space:nowrap;overflow:hidden}
.rw .nm::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--line);margin-right:6px;flex:none}
.rw.sel .nm{border-color:var(--acc);color:var(--acc)} .rw.sel .nm::before{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.rw .nm.lit::before{background:var(--fg)}
.rw .rt{border:1px solid var(--line);border-radius:3px;color:var(--dim);font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;letter-spacing:0}
.rw .rt.x{color:var(--acc);border-color:var(--acc-2)}
.rw .cells{display:grid;grid-template-columns:repeat(16,1fr);gap:2px}
.c{border:1px solid var(--line);border-radius:2px;position:relative;cursor:pointer;touch-action:none;background:var(--bg)}
.c::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--line)}
.c.b4{border-color:#363330} .c.on::after{width:9px;height:9px;margin:-4.5px;background:var(--fg)} .rw.sel .c.on::after{background:var(--acc)}
.c.cur{background:var(--bg-2)} .c.cur.on::after{box-shadow:0 0 8px var(--acc)} .c.held{background:var(--acc)} .c.held::after{background:#0a0a0b}
/* pads */
.pads{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.pad{height:52px;border:1px solid var(--line);border-radius:4px;background:var(--bg-2);touch-action:none;cursor:pointer;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font-size:10px;position:relative}
.pad.sel{border-color:var(--acc);color:var(--acc)} .pad.lit{background:#2a1a10}
/* arena */
#arena{width:100%;height:220px;display:block;border:1px solid var(--line);touch-action:none} #arena[hidden],#arena-row[hidden],#grid[hidden],.pane[hidden]{display:none!important}
.fx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px} .fx button{min-height:46px;font-size:11px;touch-action:none;padding:8px 4px}
.fx button small{display:block;color:var(--dim);font-size:9px;margin-top:3px} .fx button.hold{background:var(--acc);border-color:var(--acc);color:#0a0a0b} .fx button.hold small{color:#3a2412}
.knobs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--dim);font-size:10px;touch-action:none;cursor:ns-resize}
.knob .k{width:46px;height:46px;border-radius:50%;border:1px solid var(--fg);display:flex;align-items:center;justify-content:center;color:var(--fg);font-size:12px;letter-spacing:.02em;position:relative;background:var(--bg)}
.knob .k::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid transparent;border-top-color:var(--acc);transform:rotate(var(--rot,0deg))}
.knob.acc .k{border-color:var(--acc);color:var(--acc)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
button,select{touch-action:manipulation;font:inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;line-height:1.1;min-height:44px}
button.primary{border-color:var(--acc);color:var(--acc)} button.on{background:var(--acc);border-color:var(--acc);color:#0a0a0b} button.big{flex:1;font-size:13px}
button.recbtn{border-color:var(--rec);color:var(--rec)} button.recbtn.on{background:var(--rec);border-color:var(--rec);color:#fff}
button:disabled{opacity:.35} button:focus-visible,select:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.lbl{color:var(--dim);font-size:11px} .kn{display:flex;align-items:center;gap:8px;flex:1 1 150px;color:var(--dim);font-size:11px} .kn span{min-width:5.5em}
input[type=range]{flex:1;min-width:60px;accent-color:var(--acc);height:28px;margin:0}
.editor{border:1px solid var(--acc-2);border-radius:5px;padding:10px;display:flex;flex-direction:column;gap:6px} .editor[hidden]{display:none}
.editor .hd{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--acc);flex-wrap:wrap} .editor .hd span:last-child{display:flex;gap:4px} .editor .hd button{min-height:32px;padding:6px 8px;font-size:10px}
.editor .kn{flex:1 1 46%} .editor .kn span{min-width:4.2em;font-size:10px}
.layer{display:grid;grid-template-columns:34px 1fr 90px 44px;gap:8px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:8px}
.layer .nm{color:var(--dim)} .layer .nm b{color:var(--fg);font-weight:500} .layer button{min-height:36px;padding:8px} .layer.muted{opacity:.45}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:11px;padding:8px 14px;border-radius:4px;max-width:92%;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;text-transform:none;letter-spacing:.04em;z-index:9}
#toast.show{opacity:1}
.foot{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;border-top:1px solid var(--line);padding-top:6px} .foot b{color:var(--acc);font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">

    <div class="row">

        <label class="kn"><span>Decay</span><input data-pp="decay" type="range" min="0.2" max="3" step="0.01" value="1"></label>
        <label class="kn"><span>Cut</span><input data-pp="cut" type="range" min="0" max="1" step="0.01" value="1"></label>
        <label class="kn"><span>Level</span><input data-pp="level" type="range" min="0" max="1.5" step="0.01" value="1"></label>

      <div class="knob" data-k="vol" data-min="0" data-max="100" data-v="70"><div class="k">70</div>Vol</div>
    </div>
    <div class="row"><button id="b-play" class="big primary">▶ Play</button><button id="b-rec" class="big recbtn">● Rec layer</button><button id="b-auto">降らす</button><button id="b-undo">Undo</button></div>
  </section>

  <section class="pane" data-pane="layers">
    <div id="layers"></div>
    <div class="row"><button id="b-clear">Clear all</button></div>
  </section>

  <section class="pane" data-pane="set">
    <div class="row"><span class="lbl">Preset</span><button data-pre="video" class="on">動画</button><button data-pre="fog">霧</button><button data-pre="glass">硝子</button></div>

    <div class="row"><span class="lbl">Key</span><button id="b-key">C minor</button><label class="kn"><span>Swing</span><input id="k-swing" type="range" min="0" max="1" step="0.01" value="0.3"></label></div>
    <div class="row"><span class="lbl">粒の素材</span><button id="b-mic">● Rec</button><button id="b-file">File</button><span id="smp-name" class="lbl" style="margin-left:auto">synthetic</span><input id="f-file" type="file" hidden></div>
    <div class="lbl" style="text-transform:none">Rec / File で入れた音が「粒」セットの8音になります。編集の「逆再生」は粒では本当に逆向きに鳴ります。</div>
  </section>

  <section class="pane" data-pane="out">
    <div class="row"><span class="lbl">Export mix (1 loop)</span><button id="x-mix" class="primary">Save</button><span id="x-status" class="lbl" style="margin-left:auto"></span></div>
    <div class="row"><span class="lbl">Live record</span><button id="x30">30s</button><button id="x60">60s</button></div>
  </section>
  <div class="foot"><span>ROW <b>SELECT</b> · CELL <b>STEP</b> · PAD <b>PLAY</b></span><span id="dsp">DSP 00%</span></div>
</div>

<script>
(()=>{
/* no pinch / double-tap zoom on iOS */
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false}); document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});
let lastTouchEnd=0; document.addEventListener('touchend',e=>{ const n=Date.now(); if(n-lastTouchEnd<350) e.preventDefault(); lastTouchEnd=n; },{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

const $=s=>document.querySelector(s), css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let toastT; const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);};
document.querySelectorAll('.tabs span').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tabs span').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.dataset.pane===t.dataset.tab));});
const KEYS=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']; let key=0; const hz=m=>440*Math.pow(2,(m-69)/12), root=()=>48+key;
const P={dark:70,rev:60,tape:50,decay:100,rate:120,vol:70}; const dec=()=>P.decay/100;
let loopLen=30, loopStart=0, playing=false, layers=[], sample=null, sampleRev=null, curSet='tone', autoOn=false;
const PP=()=>({pitch:0,tone:0.5,decay:1,cut:1,level:1,pan:0,rev:1,vel:0.7,reverse:false});

/* ---------- audio ---------- */
let ac=null, M=null, proc=null, noiseB=null;
function ensureAudio(){ if(ac){ if(ac.state!=='running') ac.resume(); return ac; }
  ac=new (window.AudioContext||window.webkitAudioContext)(); noiseB=mkNoise(1);
  const padSum=ac.createGain(), stIn=ac.createGain(), stD=ac.createDelay(1), stFb=ac.createGain(); stD.delayTime.value=0.0625; stFb.gain.value=0;
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=0.7; const sat=ac.createWaveShaper(); sat.oversample='2x'; const wow=ac.createDelay(0.05); wow.delayTime.value=0.006; const lfo=ac.createOscillator(); lfo.frequency.value=0.45; const lfoG=ac.createGain(); lfoG.gain.value=0.0008; lfo.connect(lfoG).connect(wow.delayTime); lfo.start();
  const rev=ac.createConvolver(); rev.buffer=mkIR(5); const revIn=ac.createGain(), revG=ac.createGain(); const pre=ac.createGain();
  padSum.connect(stIn).connect(stD); stD.connect(stFb).connect(stD); stD.connect(lp).connect(wow).connect(sat).connect(pre); revIn.connect(rev); rev.connect(revG).connect(lp);
  const layBus=ac.createGain(), master=ac.createGain(), comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3; comp.knee.value=10; const out=ac.createGain(); const tap=ac.createMediaStreamDestination();
  pre.connect(master); layBus.connect(master); master.connect(comp).connect(out); out.connect(ac.destination); out.connect(tap);
  proc=ac.createScriptProcessor(2048,2,1); const sink=ac.createGain(); sink.gain.value=0; pre.connect(proc); proc.connect(sink).connect(ac.destination); proc.onaudioprocess=onCapture;
  M={padSum,stIn,stD,stFb,lp,sat,lfoG,revIn,revG,pre,layBus,master,out,tap}; applyKnobs(); return ac; }
function mkNoise(sec){ const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
function mkIR(sec){ const n=Math.floor(ac.sampleRate*sec), b=ac.createBuffer(2,n,ac.sampleRate); for(let c=0;c<2;c++){const d=b.getChannelData(c);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=0.82*l+0.18*w;d[i]=l*Math.pow(1-i/n,3.4)*1.4;}} return b; }
function satCurve(a){ const n=1024,c=new Float32Array(n),k=a*20+1; for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));} return c; }
function applyKnobs(){ if(!M) return; const t=ac.currentTime; if(!fx.dive&&!fx.stop) M.lp.frequency.setTargetAtTime(Math.exp(Math.log(9000)+(Math.log(650)-Math.log(9000))*(P.dark/100)),t,0.1);
  M.revG.gain.setTargetAtTime(Math.pow(P.rev/100,1.2)*1.4,t,0.1); M.sat.curve=satCurve(0.05+P.tape/100*0.5); M.lfoG.gain.setTargetAtTime(P.tape/100*0.0016,t,0.1); M.out.gain.setTargetAtTime(P.vol/100*1.1,t,0.05); }
/* every voice ends in gate(): pan + per-pad reverse envelope + abrupt cut */
function gate(t,dur,pp,pn){ const g=ac.createGain(), p=ac.createStereoPanner?ac.createStereoPanner():ac.createGain(); if(p.pan) p.pan.value=Math.max(-1,Math.min(1,pn+pp.pan)); g.connect(p).connect(M.padSum);
  if(pp.reverse){ const end=t+Math.max(0.08,dur*0.85); g.gain.setValueAtTime(0.03,t); g.gain.exponentialRampToValueAtTime(1.7,end); g.gain.setValueAtTime(0,end+0.004); } else g.gain.setValueAtTime(1,t);
  if(pp.cut<1){ const ct=t+0.012+pp.cut*pp.cut*0.9; g.gain.setValueAtTime(g.gain.value,ct); g.gain.setValueAtTime(0,ct+0.001); } return g; }
function revSend(node,amt){ const r=ac.createGain(); r.gain.value=amt; node.connect(r).connect(M.revIn); }

/* ---------- voices (v=velocity, pn=pan, pp=pad params, at=time) ---------- */
const PENTA=[0,3,5,7,10,12,15,17,19,22];
function tone(semi,v,pn,pp,at){ pp=pp||PP(); const t=at||ac.currentTime, f=hz(root()+12+semi+pp.pitch), dur=(1.6+v*2)*dec()*pp.decay, out=gate(t,dur,pp,pn), g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32*(0.4+v*0.6)*pp.level,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const mk=(mul,gain,det,dc)=>{ if(gain<0.003) return; const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f*mul; o.detune.value=det; const gg=ac.createGain(); gg.gain.setValueAtTime(gain,t); if(dc) gg.gain.setTargetAtTime(0.0001,t+0.02,dc*dec()); o.connect(gg).connect(g); o.start(t); o.stop(t+dur+0.1); };
  mk(1,1,0,0); mk(1,0.5,6,0); mk(2,(0.1+pp.tone*0.5)+v*0.2,-3,0.5); mk(3,pp.tone*0.25,2,0.25); mk(4.2,pp.tone*0.12,0,0.12); g.connect(out); revSend(g,1.4*pp.rev); }
function noise(o,pp,at){ pp=pp||PP(); const t=at||ac.currentTime, n=ac.createBufferSource(); n.buffer=noiseB; n.loop=true; const f=ac.createBiquadFilter(), fm=Math.pow(2,pp.pitch/12)*(0.5+pp.tone); if(o.bp){ f.type='bandpass'; f.frequency.value=o.bp*fm; f.Q.value=o.q||1; } else { f.type='highpass'; f.frequency.value=(o.hp||1000)*fm; }
  const len=o.len*(o.hold?1:dec()*pp.decay), g=ac.createGain(), lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=6500; const out=gate(t,o.hold?2:len,pp,o.pan); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.gain*pp.level,t+(o.fadeIn||0.002)); if(!o.hold) g.gain.exponentialRampToValueAtTime(0.0001,t+len);

/* ---------- loop, capture, layers ---------- */
let recording=false, recL=null, recR=null;
function L(){ return Math.floor(loopLen*ac.sampleRate); }
function pos(){ return playing?((ac.currentTime-loopStart)%loopLen+loopLen)%loopLen:0; }
function onCapture(e){ if(!recording||!playing) return; const inL=e.inputBuffer.getChannelData(0), inR=e.inputBuffer.numberOfChannels>1?e.inputBuffer.getChannelData(1):inL; const n=inL.length, len=L(); let idx=Math.floor(((e.playbackTime-loopStart)%loopLen+loopLen)%loopLen*ac.sampleRate); for(let i=0;i<n;i++){ recL[idx]+=inL[i]; recR[idx]+=inR[i]; idx++; if(idx>=len) idx=0; } }
function startLayerSrc(ly){ const src=ac.createBufferSource(); src.buffer=ly.buf; src.loop=true; src.loopEnd=loopLen; src.connect(ly.g); src.start(0,pos()); ly.src=src; }
function play(on){ ensureAudio(); playing=on; $('#b-play').textContent=on?'■ Stop':'▶ Play'; $('#b-play').classList.toggle('on',on);
  if(on){ loopStart=ac.currentTime+0.02; layers.forEach(ly=>{ ly.g=ly.g||ac.createGain(); ly.g.gain.value=ly.muted?0:ly.vol; ly.g.connect(M.layBus); startLayerSrc(ly); }); if(seq.on) runSeq(true); }
  else { if(recording) rec(false); layers.forEach(ly=>{ try{ly.src.stop();}catch(e){} }); } }
$('#b-play').onclick=()=>play(!playing);
function rec(on){ ensureAudio(); if(on&&!playing) play(true); recording=on; $('#b-rec').classList.toggle('on',on); $('#b-rec').textContent=on?'■ Stop rec':'● Rec layer'; $('#r-pos').classList.toggle('rec',on);
  if(on){ recL=new Float32Array(L()); recR=new Float32Array(L()); toast('録音中 — 弾くか、Run / 降らす'); }
  else if(recL){ let peak=0; for(let i=0;i<recL.length;i+=97) peak=Math.max(peak,Math.abs(recL[i]),Math.abs(recR[i])); if(peak<0.003){ toast('何も鳴らなかったので、レイヤーは作りませんでした'); recL=recR=null; return; }
    const buf=ac.createBuffer(2,L(),ac.sampleRate); buf.copyToChannel(recL,0); buf.copyToChannel(recR,1); const ly={buf,vol:1,muted:false,name:SETS[curSet].name,g:ac.createGain()}; ly.g.gain.value=1; ly.g.connect(M.layBus); startLayerSrc(ly); layers.push(ly); recL=recR=null; renderLayers(); toast('レイヤー '+layers.length+' を重ねました'); } }
$('#b-rec').onclick=()=>rec(!recording);
$('#b-undo').onclick=()=>{ const ly=layers.pop(); if(!ly) return; try{ly.src.stop();}catch(e){} ly.g.disconnect(); renderLayers(); toast('最後のレイヤーを消しました'); };
$('#b-clear').onclick=()=>{ layers.forEach(ly=>{ try{ly.src.stop();}catch(e){} ly.g.disconnect(); }); layers=[]; renderLayers(); };
function renderLayers(){ $('#r-n').textContent=layers.length; const el=$('#layers'); if(!layers.length){ el.innerHTML='<div class="lbl" style="text-transform:none">まだレイヤーがありません。Play タブで ● Rec layer → 弾く / Run / 降らす で、1周がレイヤーになります。</div>'; return; } el.innerHTML='';
  layers.forEach((ly,i)=>{ const d=document.createElement('div'); d.className='layer'+(ly.muted?' muted':''); d.innerHTML=`<span class="nm"><b>${String(i+1).padStart(2,'0')}</b></span><span class="nm">${ly.name}</span><input type="range" min="0" max="1.5" step="0.01" value="${ly.vol}" aria-label="volume"><button>${ly.muted?'Off':'On'}</button>`;
    d.querySelector('input').oninput=e=>{ ly.vol=+e.target.value; if(!ly.muted) ly.g.gain.setTargetAtTime(ly.vol,ac.currentTime,0.05); }; d.querySelector('button').onclick=()=>{ ly.muted=!ly.muted; ly.g.gain.setTargetAtTime(ly.muted?0:ly.vol,ac.currentTime,0.05); renderLayers(); }; el.appendChild(d); }); }
renderLayers();

/* ---------- 降らす ---------- */
let autoTimer=null; function autoTick(){ if(!autoOn) return; const pads=SETS[curSet].pads; const i=Math.floor(Math.random()*pads.length), p=pads[i], v=0.3+Math.random()*0.6, pn=(Math.random()-0.5)*1.2; const stop=p.f(v,pn,p.p); const el=padsEl.children[i]; if(el){ el.classList.add('lit'); setTimeout(()=>el.classList.remove('lit'),120); }
  if(stop) setTimeout(stop,400+Math.random()*2500); const swing=+$('#k-swing').value; const base=60/P.rate*1000*0.5; const wait=Math.random()<swing?base*(0.5+Math.random()*2.5):base; autoTimer=setTimeout(autoTick,Math.max(40,wait)); }
$('#b-auto').onclick=()=>{ ensureAudio(); autoOn=!autoOn; $('#b-auto').classList.toggle('on',autoOn); clearTimeout(autoTimer); if(autoOn) autoTick(); };

/* ---------- presets / set / key / sample ---------- */
const PRESETS={video:{dark:70,rev:60,tape:50,decay:100},fog:{dark:85,rev:90,tape:70,decay:160},glass:{dark:30,rev:80,tape:20,decay:120}};
document.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-pre]').forEach(x=>x.classList.toggle('on',x===b)); Object.assign(P,PRESETS[b.dataset.pre]); showKnobs(); applyKnobs(); toast('Preset: '+b.textContent); });
document.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{ if(layers.length){ toast('レイヤーがあるので長さは変えられません(Clear all で可)'); return; } loopLen=+b.dataset.len; document.querySelectorAll('[data-len]').forEach(x=>x.classList.toggle('on',x===b)); $('#r-len').textContent=loopLen; if(playing) play(true); });
$('#b-key').onclick=()=>{ key=(key+[5,7,2,10,3][Math.floor(Math.random()*5)])%12; $('#b-key').textContent=KEYS[key]+' minor'; build(); };
function setSample(b,name){ sample=b; sampleRev=ac.createBuffer(b.numberOfChannels,b.length,b.sampleRate); for(let c=0;c<b.numberOfChannels;c++){ const s=b.getChannelData(c), d=sampleRev.getChannelData(c); for(let i=0,n=s.length;i<n;i++) d[i]=s[n-1-i]; } $('#smp-name').textContent=name; curSet='grain'; selected={set:'grain',idx:0}; build(); }
$('#b-file').onclick=()=>{ensureAudio();$('#f-file').click();}; $('#f-file').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; e.target.value=''; try{ setSample(await ac.decodeAudioData(await f.arrayBuffer()),f.name.slice(0,16)); toast('粒の素材を読み込みました'); }catch(err){ toast('この形式は読み込めませんでした'); } };
let mrec=null, chunks=[]; $('#b-mic').onclick=async()=>{ ensureAudio(); if(mrec){ mrec.stop(); return; } if(!navigator.mediaDevices?.getUserMedia){ toast('マイクが使えない環境です'); return; }
  try{ const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); chunks=[]; mrec=new MediaRecorder(st); mrec.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data);};
    mrec.onstop=async()=>{ st.getTracks().forEach(x=>x.stop()); const blob=new Blob(chunks,{type:mrec.mimeType}); mrec=null; $('#b-mic').classList.remove('on'); $('#b-mic').textContent='● Rec'; try{ setSample(await ac.decodeAudioData(await blob.arrayBuffer()),'mic'); toast('録音 → 粒'); }catch(e){ toast('録音を読み込めませんでした'); } };
    mrec.start(); $('#b-mic').classList.add('on'); $('#b-mic').textContent='■ Stop'; }catch(e){ toast('マイクが許可されませんでした'); } };

/* knobs */
function showKnobs(){ document.querySelectorAll('.knob').forEach(el=>{ const k=el.dataset.k, mn=+el.dataset.min, mx=+el.dataset.max; el.querySelector('.k').textContent=P[k]; el.style.setProperty('--rot',(-135+270*(P[k]-mn)/(mx-mn))+'deg'); }); }
document.querySelectorAll('.knob').forEach(el=>{ const k=el.dataset.k, mn=+el.dataset.min, mx=+el.dataset.max; let y0=0,v0=0; el.addEventListener('pointerdown',e=>{ ensureAudio(); el.setPointerCapture(e.pointerId); y0=e.clientY; v0=P[k]; }); el.addEventListener('pointermove',e=>{ if(!(e.buttons&1)) return; let v=Math.round(v0+(y0-e.clientY)/140*(mx-mn)); v=Math.min(mx,Math.max(mn,v)); if(v!==P[k]){ P[k]=v; showKnobs(); applyKnobs(); } }); }); showKnobs();

/* ---------- stack view + frame loop ---------- */
const cv=$('#stack'), g=cv.getContext('2d'); let W=0,H=0; function resize(){ const r=cv.getBoundingClientRect(); const d=Math.min(2,devicePixelRatio||1); W=r.width;H=r.height; cv.width=W*d; cv.height=H*d; g.setTransform(d,0,0,d,0,0); } new ResizeObserver(resize).observe(cv); resize();
const peaksCache=new WeakMap(); function peaks(buf,n){ let p=peaksCache.get(buf); if(p&&p.length===n) return p; const d=buf.getChannelData(0), per=Math.floor(d.length/n); p=new Float32Array(n); for(let i=0;i<n;i++){ let m=0; for(let j=i*per;j<(i+1)*per;j+=16) m=Math.max(m,Math.abs(d[j])); p[i]=m; } peaksCache.set(buf,p); return p; }
function frame(now){ requestAnimationFrame(frame); arenaStep(now); g.clearRect(0,0,W,H); const cols=Math.floor(W/4); const n=layers.length; const rowH=n?Math.min(18,(H-6)/n):0;
  layers.forEach((ly,li)=>{ const pk=peaks(ly.buf,cols); const y=4+li*rowH+rowH/2; g.fillStyle=ly.muted?css('--line'):css('--acc'); for(let c=0;c<cols;c++){ const a=Math.min(1,pk[c]*1.3); if(a<0.02) continue; const r=0.6+a*(rowH*0.3); g.globalAlpha=0.3+a*0.7; g.beginPath(); g.arc(c*4+2,y,Math.min(r,rowH*0.35),0,6.283); g.fill(); } });
  g.globalAlpha=1; if(!n){ g.fillStyle=css('--line'); for(let c=0;c<cols;c+=2){ g.beginPath(); g.arc(c*4+2,H/2,0.8,0,6.283); g.fill(); } }
  if(recording&&recL){ g.strokeStyle=css('--rec'); g.lineWidth=1; g.strokeRect(0.5,0.5,W-1,H-1); }
  if(playing&&ac){ const x=pos()/loopLen*W; g.fillStyle=css('--fg'); g.fillRect(x-0.5,0,1,H); $('#r-pos').textContent='00:'+String(Math.floor(pos())).padStart(2,'0'); }
  $('#dsp').textContent='DSP '+String(Math.min(99,10+layers.length*9+(P.rev*0.2|0))).padStart(2,'0')+'%'; }
requestAnimationFrame(frame);

/* ---------- export ---------- */
let dl=null; (async()=>{ try{ dl=await (window.claude?.use?.('downloads')); }catch(e){} })();
async function save(blob,name){ if(dl){ try{ await dl.save({filename:name,data:blob}); toast('Saved'); }catch(e){ if(e&&e.code!=='declined') toast('保存できませんでした'); } } else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved'); } }
function wav(buf){ const n=buf.length, ch=2, sr=buf.sampleRate, out=new DataView(new ArrayBuffer(44+n*ch*2)); const w=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i));}; w(0,'RIFF'); out.setUint32(4,36+n*ch*2,true); w(8,'WAVE'); w(12,'fmt '); out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,ch,true); out.setUint32(24,sr,true); out.setUint32(28,sr*ch*2,true); out.setUint16(32,ch*2,true); out.setUint16(34,16,true); w(36,'data'); out.setUint32(40,n*ch*2,true); const L0=buf.getChannelData(0), R0=buf.numberOfChannels>1?buf.getChannelData(1):L0; let o=44; for(let i=0;i<n;i++){ out.setInt16(o,Math.max(-1,Math.min(1,L0[i]))*32767,true); out.setInt16(o+2,Math.max(-1,Math.min(1,R0[i]))*32767,true); o+=4; } return new Blob([out],{type:'audio/wav'}); }
$('#x-mix').onclick=()=>{ ensureAudio(); if(!layers.length){ toast('レイヤーがありません'); return; } const n=L(), mix=ac.createBuffer(2,n,ac.sampleRate); for(const ly of layers){ if(ly.muted) continue; for(let c=0;c<2;c++){ const d=mix.getChannelData(c), s=ly.buf.getChannelData(c); for(let i=0;i<n;i++) d[i]+=s[i]*ly.vol; } } let peak=0; for(let c=0;c<2;c++){ const d=mix.getChannelData(c); for(let i=0;i<n;i+=7) peak=Math.max(peak,Math.abs(d[i])); } if(peak>0.98){ const k=0.98/peak; for(let c=0;c<2;c++){ const d=mix.getChannelData(c); for(let i=0;i<n;i++) d[i]*=k; } }
  if(!dl){ save(wav(mix),`layers-mix-${loopLen}s.wav`); return; }
  if(!window.MediaRecorder){ toast('この環境では書き出せません'); return; } const dest=ac.createMediaStreamDestination(), src=ac.createBufferSource(); src.buffer=mix; src.connect(dest); const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m))||''; const r=new MediaRecorder(dest.stream,mime?{mimeType:mime}:undefined), ch=[]; r.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
  const stt=$('#x-status'); let left=loopLen; stt.textContent='MIX '+left; const iv=setInterval(()=>{left--;stt.textContent='MIX '+left;},1000); r.onstop=()=>{ clearInterval(iv); stt.textContent=''; save(new Blob(ch,{type:r.mimeType||mime}),`layers-mix-${loopLen}s.${(r.mimeType||mime).includes('mp4')?'mp4':'webm'}`); }; r.start(); src.start(); setTimeout(()=>{ r.stop(); try{src.stop();}catch(e){} },loopLen*1000+200); };
function liveRec(sec){ ensureAudio(); if(!window.MediaRecorder){toast('この環境では書き出せません');return;} if(!playing) play(true); const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m))||''; const r=new MediaRecorder(M.tap.stream,mime?{mimeType:mime}:undefined), ch=[]; r.ondataavailable=e=>{if(e.data.size)ch.push(e.data);};
  const stt=$('#x-status'); let left=sec; stt.textContent='REC '+left; const iv=setInterval(()=>{left--;stt.textContent='REC '+left;},1000); r.onstop=()=>{ clearInterval(iv); stt.textContent=''; const ext=(r.mimeType||mime).includes('mp4')?'mp4':'webm'; save(new Blob(ch,{type:r.mimeType||mime}),`layers-live-${sec}s.${ext}`); }; r.start(); setTimeout(()=>r.stop(),sec*1000+300); }
$('#x30').onclick=()=>liveRec(30); $('#x60').onclick=()=>liveRec(60);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ac&&ac.state!=='running') ac.resume(); });
build();
})();
</script>
</body></html>
